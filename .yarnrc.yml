cacheFolder: .yarn/cache

enableGlobalCache: false

enableHardenedMode: true

enableImmutableInstalls: true

enableInlineBuilds: true

enableInlineHunks: true

enableScripts: true

enableStrictSsl: true

nmMode: hardlinks-local

nodeLinker: node-modules

npmRegistryServer: 'https://registry.npmjs.org'

progressBarStyle: patrick

# Forward compiler peers already provided by this workspace to nested dev-tool loaders/parsers.
packageExtensions:
  '@commitlint/load@20.5.3':
    peerDependencies:
      '@types/node': '*'
      typescript: '*'
  '@commitlint/load@21.2.3':
    peerDependencies:
      '@types/node': '*'
      typescript: '*'
  '@stylistic/eslint-plugin@2.13.0':
    peerDependencies:
      typescript: '*'
  '@stylistic/eslint-plugin@4.4.1':
    peerDependencies:
      typescript: '*'
  'eslint-plugin-n@17.24.0':
    peerDependencies:
      typescript: '*'
  'xo@1.2.3':
    peerDependencies:
      typescript: '*'
  '@commitlint/cli@20.5.3':
    peerDependencies:
      '@types/node': '*'
      typescript: '*'
  'cz-conventional-changelog@3.3.0':
    peerDependencies:
      '@types/node': '*'
      typescript: '*'
  'eslint-config-xo@0.46.0':
    peerDependencies:
      typescript: '*'
  'commitizen@4.3.2':
    peerDependencies:
      '@types/node': '*'
      typescript: '*'
