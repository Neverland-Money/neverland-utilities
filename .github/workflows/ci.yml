name: CI

# Runs on every commit pushed to a pull request, and nowhere else.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Yarn 4.3.1 comes from the packageManager field; .yarn/cache is committed, so there is
      # nothing to restore from an Actions cache.
      - name: Enable Corepack
        run: corepack enable

      # The same gates, in the same order, as the RELEASE.md validation sequence.
      - name: Install
        run: HUSKY=0 YARN_ENABLE_SCRIPTS=false yarn install --immutable --mode=skip-build

      - name: Build
        run: yarn build

      - name: Check types
        run: |
          yarn check-types
          yarn check-types:fixtures
          node ./node_modules/typescript/bin/tsc -p tsconfig.test.json --noEmit

      - name: Lint
        run: yarn lint

      - name: Check formatting
        run: yarn format:check

      - name: Test
        run: yarn test

      - name: Validate workspace, fixtures and provenance
        run: |
          yarn test:validation
          yarn test:sdk-fixtures
          yarn check:sdk-provenance

      - name: Validate npm packages
        run: yarn test:packages
